site_name: "@vauban-org/agent-sdk"
site_description: "Vauban OODA agent primitives — BYOM, HITL, EventBus, EconomyRouter, Tier Templates"
site_url: "https://vauban.tech/docs/agent-sdk"
docs_dir: docs
repo_url: "https://github.com/vauban-org/command-center"
repo_name: "vauban-org/command-center"
edit_uri: "edit/main/packages/agent-sdk/docs/"

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Quickstart: index.md
  - BYOM (Bring Your Own Model): byom.md
  - Templates:
      - Overview: templates.md
  - Ports:
      - LLMProvider: ports/llm-provider.md
      - Messaging: ports/messaging.md
      - AgentRegistry: ports/agent-registry.md
      - HITL: ports/hitl.md
      - EventBus: ports/event-bus.md
  - Telemetry:
      - Overview: telemetry/overview.md
      - Sinks:
          - stdout: telemetry/sinks/stdout.md
          - sqlite (local sovereign): telemetry/sinks/sqlite.md
          - OTLP (OpenTelemetry): telemetry/sinks/otlp.md
          - Vauban CC (free → sovereign): telemetry/sinks/cc.md
      - Privacy & sovereignty: telemetry/privacy.md
      - Migration 1.2 → 1.3: telemetry/migration.md
  - Economy (EconomyRouter): economy.md
  - Platforms (clients): platforms.md
  - Identity & Persona: identity.md
  - Attestation (cert-verify): attestation.md
  - Migration:
      - 0.15 → 0.17: migration/0.15-to-0.17.md
  - Contributing: contributing.md

plugins:
  - search
